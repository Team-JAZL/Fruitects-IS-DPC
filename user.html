<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fruitects | Smart Agriculture</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');

        :root {
            --healthy: #10B981;
            --ripe: #F59E0B;
            --rotten: #EF4444;
        }

        * { font-family: 'Inter', sans-serif; }

        .status-text {
            font-size: clamp(2.5rem, 6vw, 4.5rem);
            font-weight: 900;
            letter-spacing: -0.04em;
            line-height: 1;
        }

        @keyframes shimmer {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }

        .shimmer-animation {
            background: linear-gradient(90deg, #059669, #10B981, #34D399);
            background-size: 200% 100%;
            animation: shimmer 1.5s ease-in-out infinite;
        }

        /* Smooth reveal for results */
        .reveal {
            animation: reveal 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes reveal {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        #scanZone {
            aspect-ratio: 1 / 1;
            max-width: 100%;
            min-height: 320px;
        }

        #previewImage {
            object-fit: contain;
            background: #f8fafc;
        }

        #cameraVideo {
            object-fit: cover;
        }
    </style>
</head>
<body class="bg-gray-50 min-h-screen antialiased">

    <header class="bg-white border-b border-gray-100 sticky top-0 z-50">
        <div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-20">
                <div class="flex items-center gap-3">
                    <div class="w-12 h-12 bg-gray-900 rounded-2xl flex items-center justify-center shadow-xl shadow-emerald-100">
                        <span class="text-white text-sm font-black tracking-tighter">JAZL</span>
                    </div>
                    <div>
                        <p class="text-[10px] text-emerald-600 font-black uppercase tracking-widest leading-none mb-1">Smart Agriculture Platform</p>
                        <h1 class="text-xl font-black text-gray-900 leading-none tracking-tight">Fruitects</h1>
                    </div>
                </div>
                
                <div class="flex items-center gap-2 px-3 py-1.5 bg-gray-50 rounded-full border border-gray-100">
                    <span class="relative flex h-2 w-2">
                        <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                        <span class="relative inline-flex rounded-full h-2 w-2 bg-emerald-500"></span>
                    </span>
                    <span class="text-[10px] font-bold text-gray-500 uppercase tracking-widest">Link Active</span>
                </div>
            </div>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <div class="space-y-6">
            
            <div class="bg-white rounded-3xl shadow-sm border border-gray-100 p-6 sm:p-8">
                <div class="mb-6">
                    <h2 class="text-lg font-bold text-gray-800">Scan Interface</h2>
                    <p class="text-sm text-gray-500">Upload or capture fruit to inspect crop condition and quality.</p>
                </div>

                <div id="scanZone" class="relative overflow-hidden min-h-[320px] rounded-2xl border-2 border-dashed border-gray-200 bg-gray-50 flex flex-col items-center justify-center p-6 text-center transition-all">
                    
                    <div id="emptyState" class="flex flex-col items-center gap-4">
                        <div class="w-20 h-20 bg-white rounded-full shadow-sm flex items-center justify-center border border-gray-100">
                            <i data-lucide="scan-face" class="w-10 h-10 text-emerald-500"></i>
                        </div>
                        <div>
                            <p class="text-sm font-bold text-gray-700">Awaiting Input...</p>
                            <p class="text-xs text-gray-400 mt-1">PNG, JPG or Camera Feed</p>
                        </div>
                    </div>

                    <img id="previewImage" src="" alt="Preview" class="hidden absolute inset-0 w-full h-full object-cover rounded-2xl" />

                    <div id="cameraContainer" class="hidden absolute inset-0 bg-black rounded-2xl overflow-hidden">
                        <video id="cameraVideo" class="w-full h-full object-cover" autoplay playsinline muted></video>
                    </div>

                    <div id="processingOverlay" class="hidden absolute inset-0 bg-white/95 backdrop-blur-md rounded-2xl flex flex-col items-center justify-center z-20 p-8">
                        <div class="w-20 h-20 mb-6 relative">
                            <div class="absolute inset-0 border-4 border-emerald-100 rounded-full"></div>
                            <div class="absolute inset-0 border-4 border-emerald-500 rounded-full border-t-transparent animate-spin"></div>
                            <i data-lucide="cpu" class="w-8 h-8 text-emerald-600 absolute inset-0 m-auto"></i>
                        </div>
                        <p id="progressLabel" class="text-sm font-black text-gray-800 uppercase tracking-widest mb-4 italic">Inspecting quality...</p>
                        <div class="w-full max-w-xs bg-gray-100 rounded-full h-3 overflow-hidden shadow-inner">
                            <div id="progressBar" class="shimmer-animation h-full rounded-full transition-all duration-300" style="width: 0%;"></div>
                        </div>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-4 mt-6">
                    <button id="btnCamera" class="flex items-center justify-center gap-2 px-6 py-4 bg-white border-2 border-gray-100 rounded-2xl text-sm font-bold text-gray-700 hover:border-emerald-500 hover:text-emerald-600 transition-all active:scale-95">
                        <i data-lucide="camera" class="w-5 h-5"></i> Camera
                    </button>
                    <button id="btnUpload" class="flex items-center justify-center gap-2 px-6 py-4 bg-white border-2 border-gray-100 rounded-2xl text-sm font-bold text-gray-700 hover:border-emerald-500 hover:text-emerald-600 transition-all active:scale-95">
                        <i data-lucide="upload-cloud" class="w-5 h-5"></i> Upload
                    </button>
                </div>
                
                <input type="file" id="fileInput" accept="image/*" class="hidden" />

                <button id="hitScanBtn" disabled class="w-full mt-4 py-5 px-6 rounded-2xl text-white text-xl font-black flex items-center justify-center gap-3 transition-all shadow-xl shadow-emerald-100 bg-gray-900 disabled:bg-gray-200 disabled:text-gray-400 disabled:shadow-none active:scale-[0.98]">
                    <i data-lucide="zap" class="w-6 h-6"></i> START FRUIT SCAN
                </button>
                <button id="btnClear" class="hidden w-full mt-3 py-2 text-xs font-bold text-red-400 hover:text-red-600 transition-colors uppercase tracking-widest">
                    Clear current frame
                </button>
            </div>

            <div id="resultCard" class="hidden reveal bg-white rounded-3xl shadow-xl shadow-emerald-50/50 border-2 border-emerald-500 p-8 transition-all">
                <div class="flex items-center justify-between mb-8 pb-6 border-b border-gray-50">
                    <div>
                        <p class="text-[10px] uppercase tracking-[0.2em] font-black text-emerald-600 mb-2">Crop Condition</p>
                        <h3 id="resultFruitType" class="text-3xl font-black text-gray-900 flex items-center">--</h3>
                    </div>
                    <span id="resultBadge" class="px-4 py-2 rounded-xl text-xs font-black uppercase tracking-widest bg-gray-100 text-gray-600 shadow-sm">--</span>
                </div>
                
                <div class="text-center py-6">
                    <p id="resultStatus" class="status-text text-gray-200 mb-4">--</p>
                    <div class="inline-block bg-gray-50 px-6 py-3 rounded-2xl border border-gray-100">
                        <p id="resultSubtext" class="text-sm font-medium text-gray-600 italic">--</p>
                    </div>
                </div>

                <button id="btnScanAgain" class="w-full mt-8 py-4 bg-emerald-500 hover:bg-emerald-600 text-white rounded-2xl text-sm font-black uppercase tracking-widest shadow-lg shadow-emerald-200 transition-all">
                    New Analysis
                </button>
            </div>
        </div>
    </main>

    <script src="https://unpkg.com/lucide@latest"></script>
    <script>lucide.createIcons();</script>
    <script src="script.js"></script>
</body>
</html>
